name: Send digest email

on:
  push:
    branches: [main]
    paths:
      - 'reports/security-digest/**.md'

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find changed digest file
        id: find
        run: |
          FILE=$(git diff --name-only HEAD^ HEAD -- 'reports/security-digest/*.md' | tail -n1)
          if [ -z "$FILE" ]; then
            echo "no digest file changed in this push, skipping"
            echo "file=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "date=$(basename "$FILE" .md)" >> "$GITHUB_OUTPUT"

      - name: Send email
        if: steps.find.outputs.file != ''
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_RECIPIENT: ${{ secrets.DIGEST_RECIPIENT }}
        run: python3 .claude/skills/security-news-digest/scripts/send_digest_email.py "${{ steps.find.outputs.file }}" "${{ steps.find.outputs.date }}"
